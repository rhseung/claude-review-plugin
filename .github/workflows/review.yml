name: review

on:
  workflow_call:

jobs:
  # PR 열림/push -> 수정된 thread 닫기 -> 첫 리뷰는 PR 전체, 이후는 지난 리뷰 뒤의 변경만
  # 리뷰 -> 막는 피드백이 남으면 request changes, 없으면 approve
  review:
    # 포크 PR 은 시크릿이 없어 실패 대신 건너뛴다
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # push 는 진행 중인 리뷰를 밀어낸다. 밀려난 리뷰는 제출 전이라 표시가 남지 않으므로
    # 다음 리뷰의 범위가 그 push 까지 덮는다
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # 리뷰 범위와 모델을 정한다. 봇의 앱 토큰은 Actions 안에서만 생기므로 조회는 GITHUB_TOKEN
      # 으로 여기서 한다. 조회가 실패하면 전체 리뷰로 기운다: 범위를 넓게 잡는 쪽이 안전하다
      - id: plan
        run: |
          # pr.md 가 push 리뷰마다 본문에 남기는 <!-- claude-review:SHA -->. reply/mention 이 낸 리뷰는
          # 범위를 덮지 않으므로 세지 않는다. 리뷰의 commit_id 는 쓰지 않는다: dismiss 되지 않은
          # approval 은 push 때 GitHub 가 commit_id 를 새 HEAD 로 옮겨서, 다음 push 가 "변경 없음"이 된다
          reviewed=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews?per_page=100" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body // "" | capture("<!-- claude-review:(?<sha>[0-9a-f]{40}) -->") | .sha') || reviewed=
          # grep -c 는 0건일 때 1 로 끝나고, run 은 bash -e 로 돈다
          round=$(( $(grep -c . <<< "$reviewed" || true) + 1 ))
          last=$(tail -n1 <<< "$reviewed")
          mode=full base=
          if [ -n "$last" ]; then
            # status 가 ahead/identical 이 아니면 지난 리뷰 커밋이 HEAD 의 조상이 아니다 (force push, rebase)
            cmp=$(gh api "repos/$GH_REPO/compare/$last...$HEAD" \
              --jq '{status, total_commits, commits: [.commits[] | {sha, merge: (.parents | length > 1)}]}') || cmp=
            status=$(jq -r '.status // empty' <<< "$cmp" 2>/dev/null)
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              mode=incremental base=$last
              # 새 커밋 중 PR 쪽 커밋이 base 브랜치 merge 뿐이면 merge 모드. base 에서 넘어온 커밋은 PR
              # 커밋 목록에 없다. 비교 목록이 잘렸으면(250개 초과) 판단하지 않고 incremental 로 둔다
              pr_commits=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/commits?per_page=100" --jq '.[].sha') || pr_commits=
              if [ -n "$pr_commits" ] && [ "$(jq '.total_commits' <<< "$cmp")" = "$(jq '.commits | length' <<< "$cmp")" ]; then
                own=$(jq -r --arg shas "$pr_commits" '($shas | split("\n")) as $pr | [.commits[] | select(.sha as $s | $pr | index($s))]' <<< "$cmp")
                if [ "$(jq 'length > 0 and all(.merge)' <<< "$own")" = true ]; then
                  mode=merge
                fi
              fi
            fi
          fi
          # 첫 리뷰만 opus 로 PR 전체를 본다. 이후 라운드는 범위가 좁아 sonnet 으로 충분하다
          if [ "$round" = 1 ]; then model=claude-opus-5-5; else model=claude-sonnet-5-5; fi
          echo "round=$round mode=$mode base=$base model=$model"
          {
            echo "round=$round"
            echo "mode=$mode"
            echo "base=${base:--}"
            echo "model=$model"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 플러그인은 이 워크플로와 같은 커밋에서 읽는다. 마켓플레이스 git URL 은 늘 기본 브랜치를
      # 받아오므로, 그대로 두면 @v1 이나 브랜치를 가리킨 호출자도 main 의 프롬프트로 돈다.
      # 호출자 체크아웃 뒤에 둬야 한다: 앞에 두면 저장소 체크아웃이 이 디렉터리를 지운다
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository || 'rhseung/claude-review-plugin' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .claude-review/plugin
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.claude-review/plugin
          plugins: review@rhseung
          prompt: /review:pr ${{ github.repository }} ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} ${{ steps.plan.outputs.mode }} ${{ steps.plan.outputs.base }} ${{ steps.plan.outputs.round }}
          claude_args: |
            --model ${{ steps.plan.outputs.model }}
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Edit(/.claude-review/**)"

  # thread 답글 -> 답이 안 달린 내 thread 를 전부 처리 -> 막는 thread 가 남으면 request changes,
  # 없으면 approve. 먼저 시작한 push 리뷰가 돌고 있으면 승인은 그쪽에 맡긴다
  reply:
    # App 토큰으로 단 내 답글도 이 이벤트를 다시 쏜다
    if: >-
      ${{ github.event_name == 'pull_request_review_comment' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.comment.user.login != 'claude[bot]' &&
          github.event.comment.in_reply_to_id != null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 그룹당 대기 run 은 하나만 남고 앞선 대기 run 은 취소된다. 그래서 각 run 이 COMMENT_ID 만이
    # 아니라 답이 밀린 thread 를 모두 처리한다: 취소된 run 의 답글은 살아남은 run 이 맡는다
    concurrency:
      group: review-comment-${{ github.event.pull_request.number }}
    steps:
      # 봇의 앱 토큰은 Actions 를 못 읽을 수 있다. 조회는 GITHUB_TOKEN 으로 여기서 한다
      - id: inflight
        run: |
          wf=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || wf=
          n=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?event=pull_request&head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length') || n=
          # 조회가 실패해도 잡은 살리고, 승인을 미루는 쪽으로 기운다
          [ -n "$n" ] || n=1
          echo "count=$n" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # review 잡과 같은 이유로 플러그인을 이 워크플로와 같은 커밋에서 읽는다
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository || 'rhseung/claude-review-plugin' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .claude-review/plugin
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.claude-review/plugin
          plugins: review@rhseung
          prompt: /review:reply ${{ github.repository }} ${{ github.event.pull_request.number }} ${{ github.event.comment.id }} ${{ steps.inflight.outputs.count }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Edit(/.claude-review/**)"

  # @claude 멘션 -> 요청대로 재리뷰하거나 답변 -> 리뷰 제출과 승인 규칙은 reply와 동일
  mention:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login != 'claude[bot]' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # reply 와 그룹을 나눈다. 같은 그룹이면 답글이 몰릴 때 대기 중인 멘션이 취소된다
    concurrency:
      group: review-mention-${{ github.event.issue.number }}
    steps:
      # issue_comment 페이로드엔 head repo 가 없다. 포크 코드를 시크릿 옆에서 열지 않는다
      - run: test "$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)" = false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}

      # 봇의 앱 토큰은 Actions 를 못 읽을 수 있다. 조회는 GITHUB_TOKEN 으로 여기서 한다
      - id: inflight
        run: |
          wf=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || wf=
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid) || sha=
          n=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?event=pull_request&head_sha=$sha&per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length') || n=
          # 조회가 실패해도 잡은 살리고, 승인을 미루는 쪽으로 기운다
          [ -n "$n" ] || n=1
          echo "count=$n" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}

      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      # review 잡과 같은 이유로 플러그인을 이 워크플로와 같은 커밋에서 읽는다
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository || 'rhseung/claude-review-plugin' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .claude-review/plugin
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ github.workspace }}/.claude-review/plugin
          plugins: review@rhseung
          prompt: /review:mention ${{ github.repository }} ${{ github.event.issue.number }} ${{ github.event.comment.id }} ${{ steps.inflight.outputs.count }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),Edit(/.claude-review/**)"
